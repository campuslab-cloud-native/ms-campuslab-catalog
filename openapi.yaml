openapi: 3.0.3

info:
  title: CampusLab Catalog Internal API
  version: 1.0.0
  description: >-
    API interna de catálogo. Este microservicio no implementa autenticación
    HTTP propia; la autorización por roles de las rutas públicas se aplica en
    ms-campuslab-bff. Las rutas de disponibilidad son llamadas internas de
    Bookings.

servers:
  - url: http://localhost:8082

tags:
  - name: Catalog

paths:
  /api/v1/catalog/resources:
    get:
      tags:
        - Catalog
      summary: Listar recursos
      operationId: getResources
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ResourceType'
      responses:
        '200':
          description: Recursos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceResponse'

    post:
      tags:
        - Catalog
      summary: Crear recurso
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
      responses:
        '201':
          description: Recurso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: Solicitud inválida

  /api/v1/catalog/resources/{id}:
    get:
      tags:
        - Catalog
      summary: Obtener recurso por ID
      operationId: getResourceById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Recurso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '404':
          description: Recurso no encontrado

    put:
      tags:
        - Catalog
      summary: Actualizar recurso
      operationId: updateResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
      responses:
        '200':
          description: Recurso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          description: Solicitud inválida
        '404':
          description: Recurso no encontrado

  /api/v1/catalog/resources/{id}/availability/reserve:
    post:
      tags:
        - Catalog
      summary: Reservar un cupo del recurso
      description: Operación interna invocada por Bookings al crear la solicitud.
      operationId: reserveResourceAvailability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Cupo reservado
        '404':
          description: Recurso no encontrado
        '409':
          description: No hay cupos disponibles

  /api/v1/catalog/resources/{id}/availability/release:
    post:
      tags:
        - Catalog
      summary: Liberar un cupo del recurso
      description: Operación interna invocada por Bookings al cancelar o devolver una reserva.
      operationId: releaseResourceAvailability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Idempotency-Key
          in: header
          required: true
          description: Identificador estable de la operación de liberación.
          schema:
            type: string
            maxLength: 128
      responses:
        '204':
          description: Cupo liberado o liberación duplicada ya procesada
        '404':
          description: Recurso no encontrado
        '409':
          description: La clave de idempotencia ya se usó para otro recurso

components:
  schemas:
    ResourceRequest:
      type: object
      required:
        - name
        - type
        - availableQuantity
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ResourceType'
        availableQuantity:
          type: integer
          minimum: 0

    ResourceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/ResourceType'
        availableQuantity:
          type: integer

    ResourceType:
      type: string
      enum:
        - LAB
        - EQUIPMENT
        - SUPPLY
